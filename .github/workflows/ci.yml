# CI：在全新克隆上完成「构建 + 全部免游戏测试」。
# 零依赖偏见：唯一的第三方 OCaml 库是 yojson；mock 冒烟只用 Python 标准库。
#
# 三平台矩阵的用途不只是"多测一遍"，而是**跨平台可行性探针**：
# mock_smoke.py 全程不需要游戏（它自己起一个假 mod），所以 153 项断言
# 在三平台上跑通，就等于证明了「内核层不含平台绑定」。
# 若某个 runner 红，说明内核里真的有平台假设，而不是环境问题——
# 这正是决定"要不要做 macOS/Linux 端到端支持"的实证依据。
#
# ⚠️ 但 **macOS runner 不能放在每次 push 的关键路径上**：
#    GitHub 免费档的 macOS 机队很紧张，实测 push 之后 Linux / Windows 3~8 分钟就出结果，
#    而 macOS 那一格可能排队十几分钟甚至更久 —— 于是整个 run 一直挂着"进行中"，
#    挡住的是「这次改动到底过没过」这个唯一有用的信息。
#    ⇒ 策略：**push / PR 只跑 Linux + Windows**（快反馈）；
#      **macOS 挪到每天定时 + 手动触发 + 打 tag 时跑**（覆盖照旧，只是不挡人）。
#    平台集合由 `plan` 作业算出来，下面的步骤只写一份，不会漂。
#
# 注意：端到端仍依赖执行器 mod，其 /press_key 与 /click_tile 走 user32 的
# keybd_event / mouse_event，非 Windows 不可用。矩阵绿 ≠ 非 Windows 能玩。
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"] # 打 tag = 出发布，这时候值得等 macOS
  pull_request:
  workflow_dispatch: # 手动跑（默认带 macOS）
  schedule:
    # 每天 UTC 19:00 = 北京时间 03:00，避开整点高峰
    - cron: "0 19 * * *"

permissions:
  contents: read

jobs:
  plan:
    name: 决定这次跑哪些平台
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: 选平台
        id: pick
        shell: bash
        run: |
          linux='{"os":"ubuntu-latest","label":"Linux x86_64","python":"python3"}'
          win='{"os":"windows-latest","label":"Windows x86_64","python":"python"}'
          mac='{"os":"macos-latest","label":"macOS arm64","python":"python3"}'
          if [ "${{ github.event_name }}" = "schedule" ] \
             || [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "matrix={\"include\":[$linux,$win,$mac]}" >> "$GITHUB_OUTPUT"
            echo "平台：Linux + Windows + macOS（定时 / 手动 / tag）"
          else
            echo "matrix={\"include\":[$linux,$win]}" >> "$GITHUB_OUTPUT"
            echo "平台：Linux + Windows（push / PR；macOS 见每日定时）"
          fi

  build-test:
    name: 构建与测试（${{ matrix.label }}）
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      # 不让一个平台失败掩盖其它平台的结果——探针要一次看全。
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 装配 OCaml 5.5（经 opam）
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"

      - name: 安装依赖（唯一的第三方库：yojson）
        run: opam install --yes yojson

      - name: 构建（这一步在验证：干净的源码树可以编译）
        run: opam exec -- dune build

      - name: 单元测试（验证：JSON-RPC 编解码 / 状态解析渲染 / 地块数学）
        run: opam exec -- dune runtest

      # dune 在所有平台都输出 main.exe，mock_smoke.py 的路径假设无需分叉。
      - name: mock 冒烟（验证：153 项全流程断言，不需要游戏）
        run: ${{ matrix.python }} test/mock_smoke.py
